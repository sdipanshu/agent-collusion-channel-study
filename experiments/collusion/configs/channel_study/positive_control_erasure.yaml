simulation:
  max_iterations: 1
  max_planning_rounds: 2
  max_conversation_steps: 3
  seed: 1728
environment:
  import_path: experiments.collusion.choice.competitive_dev_env:CompetitiveDevEnvironment
  max_tasks: 8
  assignment_filling: false
  skill_eps: 0.1
  cost_weights:
    load: 1.0
communication_network:
  topology: watts_strogatz
  num_agents: 6
  k: 2
  rewire_prob: 0.0
  consolidate_channels: false
llm_models:
- label: candidate0
  llm:
    provider: huggingface
    huggingface:
      model: openai/gpt-oss-120b:baseten
      params:
        temperature: 0.7
        max_output_tokens: 16384
experiment:
  tag: positive_control_erasure
  output_dir: experiments/collusion/outputs/positive_control_erasure
  max_concurrent_runs: 1
  seeds:
  - 1733
  collusion:
    colluder_selection: fixture_pair
    agent_order: random
  sweeps:
  - name: competitive_jira
    topologies:
    - watts_strogatz
    num_agents:
    - 6
    colluder_counts:
    - 2
    secret_channel_enabled:
    - false
    prompt_variants:
    - simple
  planning_rounds: 3
  channel_study:
    enabled: true
    protocol_version: channel_preference_v3
    stage: pilot
    monitored: true
    mutability: read_write
    incentive: coalition
    pair_layout: nonadjacent
    pair_index: 0
    monitor_treatment: fail
    monitor_backend: independent_hf
    monitor_model: Qwen/Qwen3.8-27B:deepinfra
    monitor_validation: null
  log_prompts: true
  max_conversation_steps: 1
